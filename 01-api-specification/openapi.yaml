openapi: 3.0.3
info:
  title: Statements & Certificates Service API
  version: 1.0.0
  description: |
    Сервис первичной валидации, оформления и постановки электронных справок и выписок в очередь на факсимильное подписание.
    
    ### Особенности:
    * Метод создания заявки поддерживает **идемпотентность** через заголовок `X-Idempotency-Key`.
    * Ограничение частоты вызовов (Rate Limiting): до 60 запросов в минуту.
    * Все ошибки возвращаются в едином стандарте **RFC 7807 (Problem Details)**.

servers:
  - url: https://api-stage.bank.internal/v1
    description: Тестовый контур (Stage)

paths:
  /documents/process:
    post:
      summary: Создание заявки на обработку и подписание справки/выписки
      description: |
        Принимает сформированный файл справки или выписки в формате Base64 (PDF) и метаданные заявки.
        
        **Поведение:**
        * При первичном вызове заявка регистрируется в системе со статусом `PROCESSING`, после готовности клиенту отправляется Webhook-уведомление.
        * При повторном запросе с тем же `X-Idempotency-Key` в течение 24 часов дубликат не создается, возвращается результат первой обработки.
      operationId: processDocument
      tags:
        - Statements & Certificates
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          description: Уникальный ключ запроса (UUID v4) для защиты от дублирования заявок на выпуск справок при сетевых сбоях.
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      requestBody:
        required: true
        description: Метаданные и содержимое справки/выписки для подписания
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentProcessRequest'
      responses:
        '201':
          description: Заявка на справку/выписку успешно принята в обработку
          headers:
            Location:
              description: Относительный URI для проверки статуса сформированного документа
              schema:
                type: string
                example: "/documents/doc_987654321/status"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentProcessResponse'
        '400':
          description: Некорректный синтаксис JSON или поврежденные данные
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Не передан, просрочен или невалиден JWT-токен в заголовке Authorization
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Конфликт обработки — запрос с таким X-Idempotency-Key еще выполняется в очереди
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://api.bank.internal/errors/conflict"
                title: "Conflict"
                status: 409
                detail: "Запрос с данным X-Idempotency-Key находится в обработке. Повторите запрос позже."
        '422':
          description: Ошибка валидации бизнес-правил (недопустимый размер, неизвестный docType, поврежденный PDF)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://api.bank.internal/errors/unprocessable-entity"
                title: "Validation Failed"
                status: 422
                detail: "Размер файла превышает допустимый лимит 15MB"
                invalidParams:
                  - field: "payloadBase64"
                    reason: "Размер файла 18.2MB превышает максимально допустимый лимит 15MB"
        '429':
          description: Превышен лимит запросов (Rate Limit). Сервис временно блокирует вызовы
          headers:
            Retry-After:
              description: Время ожидания в секундах до возможности повторить запрос
              schema:
                type: integer
                example: 60
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://api.bank.internal/errors/too-many-requests"
                title: "Too Many Requests"
                status: 429
                detail: "Превышен лимит вызовов (максимум 60 req/min). Повторите запрос через 60 секунд."
        '504':
          description: Таймаут внешнего сервиса подписания (SignSvc). Безопасно повторить запрос с тем же X-Idempotency-Key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://api.bank.internal/errors/gateway-timeout"
                title: "Gateway Timeout"
                status: 504
                detail: "Внешний сервис факсимильного подписания не ответил за 5 секунд."

components:
  schemas:
    DocumentProcessRequest:
      type: object
      required:
        - externalId
        - docType
        - payloadBase64
      properties:
        externalId:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Z0-9_-]+$'
          description: |
            Уникальный номер заявки во внешней системе (CRM, B2B-портал, мобильное приложение).
            Допустимы заглавные латинские буквы, цифры, знаки тире и подчеркивания.
          example: "CRM-STMT-10928"
        docType:
          type: string
          description: |
            Тип запрашиваемой справки или выписки:
            * `ACCOUNT_STATEMENT` — Выписка о движении средств по счету.
            * `BALANCE_CERTIFICATE` — Справка об остатке средств и открытых счетах.
            * `TAX_CERTIFICATE` — Справка для налоговых органов (2-НДФЛ / по процентам).
          enum:
            - ACCOUNT_STATEMENT
            - BALANCE_CERTIFICATE
            - TAX_CERTIFICATE
          example: "ACCOUNT_STATEMENT"
        payloadBase64:
          type: string
          format: byte
          description: |
            Содержимое документа строго в формате PDF, закодированное в строку Base64.
            Максимальный размер исходного файла — не более 15 МБ.
          example: "JVBERi0xLjQKJcOkw7zDtsOf..."

    DocumentProcessResponse:
      type: object
      required:
        - documentId
        - status
        - createdAt
      properties:
        documentId:
          type: string
          pattern: '^doc_[0-9]{9}$'
          description: Внутренний уникальный идентификатор справки/выписки в сервисе процессинга.
          example: "doc_987654321"
        status:
          type: string
          description: |
            Текущий статус документа в очереди на обработку:
            * `PROCESSING` — Заявка принята, идет валидация и постановка в очередь на подписание.
            * `COMPLETED` — Обработка завершена, факсимиле наложено, отправляется Webhook.
            * `FAILED` — Ошибка при наложении факсимиле или файл поврежден.
          enum:
            - PROCESSING
            - COMPLETED
            - FAILED
          example: "PROCESSING"
        createdAt:
          type: string
          format: date-time
          description: Дата и время постановки в очередь в формате ISO 8601 (UTC).
          example: "2026-10-15T11:42:00Z"

    ProblemDetails:
      type: object
      description: Схема ошибки в соответствии со спецификацией RFC 7807 (Problem Details for HTTP APIs).
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI-ссылка на страницу с подробным описанием ошибки.
          example: "https://api.bank.internal/errors/bad-request"
        title:
          type: string
          description: Краткое человекочитаемое резюме типа ошибки.
          example: "Bad Request"
        status:
          type: integer
          description: Код статуса HTTP, возвращенный сервером.
          example: 400
        detail:
          type: string
          description: Детальное описание конкретной причины сбоя в данном запросе.
          example: "Некорректный синтаксис JSON в теле запроса"
        invalidParams:
          type: array
          description: Список полей, не прошедших валидацию (при наличии).
          items:
            type: object
            required:
              - field
              - reason
            properties:
              field:
                type: string
                description: Имя поля с некорректным значением
                example: "payloadBase64"
              reason:
                type: string
                description: Описание причины отклонения значения
                example: "Неверная кодировка Base64 или поврежденные байты"
